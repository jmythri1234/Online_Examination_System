<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Questions | ExamPro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #334e9b;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        h2 {
            margin-bottom: 10px;
            font-size: 27px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #4f46e5;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #eef2ff;
            color: #3730a3;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            .card {
                padding: 23px 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📝 ExamPro</h1>
        <a href="{{ url_for('admin_dashboard') }}">← Dashboard</a>
    </header>

    <main class="container">
        <div class="card">

            <h2>Add Exam Question</h2>

            <p class="subtitle">
                Enter a multiple-choice question, provide four options,
                and select the correct answer.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('add_question', exam_id=exam.id) }}">

                <label for="question_text">Question</label>
                <textarea
                    id="question_text"
                    name="question_text"
                    placeholder="Enter your question"
                    required
                ></textarea>

                <label for="option_a">Option A</label>
                <input
                    type="text"
                    id="option_a"
                    name="option_a"
                    placeholder="Enter option A"
                    required
                >

                <label for="option_b">Option B</label>
                <input
                    type="text"
                    id="option_b"
                    name="option_b"
                    placeholder="Enter option B"
                    required
                >

                <label for="option_c">Option C</label>
                <input
                    type="text"
                    id="option_c"
                    name="option_c"
                    placeholder="Enter option C"
                    required
                >

                <label for="option_d">Option D</label>
                <input
                    type="text"
                    id="option_d"
                    name="option_d"
                    placeholder="Enter option D"
                    required
                >

                <label for="correct_answer">Correct Answer</label>
                <select id="correct_answer" name="correct_answer" required>
                    <option value="">Select correct answer</option>
                    <option value="A">Option A</option>
                    <option value="B">Option B</option>
                    <option value="C">Option C</option>
                    <option value="D">Option D</option>
                </select>

                <button type="submit">➕ Save Question</button>

            </form>

        </div>
    </main>

</body>
</html>
