<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam | ExamPro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6fb;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #334e9b;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 650px;
            margin: 55px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .form-card h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #4f46e5;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #eef2ff;
            color: #3730a3;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            .container {
                margin: 25px auto;
            }

            .form-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📝 ExamPro</h1>
        <a href="{{ url_for('admin_dashboard') }}">← Dashboard</a>
    </header>

    <main class="container">
        <div class="form-card">

            <h2>Create New Exam</h2>
            <p class="subtitle">
                Set up an examination for students on the ExamPro platform.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('create_exam') }}">

                <label for="title">Exam Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. Python Programming Test"
                    maxlength="150"
                    required
                >

                <label for="description">Exam Description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter exam instructions or description"
                ></textarea>

                <label for="duration">Duration (minutes)</label>
                <input
                    type="number"
                    id="duration"
                    name="duration"
                    min="1"
                    max="300"
                    value="30"
                    required
                >

                <button type="submit">➕ Create Exam</button>

            </form>
        </div>
    </main>

</body>
</html>
