<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ExamPro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #f0edff, #edf5ff);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(55, 45, 140, 0.12);
        }

        .logo {
            text-align: center;
            color: #5546e8;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #172033;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #344054;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9dce7;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5546e8;
            box-shadow: 0 0 0 3px rgba(85, 70, 232, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #5546e8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #4335c5;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            background: #fff0f0;
            color: #b42318;
        }

        .message.success {
            background: #ecfdf3;
            color: #027a48;
        }

        .bottom-text {
            text-align: center;
            color: #667085;
            font-size: 14px;
            margin-top: 23px;
        }

        a {
            color: #5546e8;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #667085;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">ExamPro.</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Login to continue to your examination dashboard.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ 'success' if category == 'success' else '' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Login →</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

        <a href="{{ url_for('home') }}" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>
</html>
